<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#5B9CF6"/>
      <stop offset="100%" stop-color="#3B6FE8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="rgba(0,0,0,0.28)"/>
    </filter>
    <filter id="shadow-sm" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.18)"/>
    </filter>
  </defs>

  <!-- Fundo arredondado macOS -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Documento PDF (atrás, rotacionado -12°) -->
  <g transform="translate(512,480) rotate(-12)" filter="url(#shadow)">
    <!-- Corpo do documento -->
    <rect x="-148" y="-200" width="240" height="300" rx="18" fill="white" opacity="0.85"/>
    <!-- Dobra da orelha -->
    <path d="M 72,-200 L 92,-200 L 92,-158 L 50,-158 Z" fill="white" opacity="0.55"/>
    <path d="M 50,-200 L 92,-158 L 50,-158 Z" fill="#c5d8f8"/>
    <!-- Linhas de texto simuladas -->
    <rect x="-120" y="-130" width="170" height="14" rx="7" fill="#BBCFEE" opacity="0.7"/>
    <rect x="-120" y="-106" width="140" height="14" rx="7" fill="#BBCFEE" opacity="0.5"/>
    <rect x="-120" y="-82" width="155" height="14" rx="7" fill="#BBCFEE" opacity="0.5"/>
    <!-- Label PDF -->
    <text x="-110" y="-152" font-family="SF Pro Display, Helvetica, Arial, sans-serif"
          font-size="44" font-weight="700" fill="#3B6FE8" opacity="0.9">PDF</text>
  </g>

  <!-- Documento Markdown (frente, rotacionado +8°) -->
  <g transform="translate(530,510) rotate(8)" filter="url(#shadow)">
    <!-- Corpo do documento -->
    <rect x="-110" y="-220" width="240" height="310" rx="18" fill="white"/>
    <!-- Dobra da orelha -->
    <path d="M 110,-220 L 130,-220 L 130,-178 L 88,-178 Z" fill="white" opacity="0.6"/>
    <path d="M 88,-220 L 130,-178 L 88,-178 Z" fill="#d8e8fc"/>
    <!-- Símbolo M↓ centralizado -->
    <text x="10" y="-60" font-family="SF Pro Display, Helvetica, Arial, sans-serif"
          font-size="120" font-weight="800" fill="#3B6FE8"
          text-anchor="middle">M↓</text>
    <!-- Linhas decorativas abaixo -->
    <rect x="-80" y="30" width="160" height="12" rx="6" fill="#BBCFEE" opacity="0.6"/>
    <rect x="-80" y="52" width="120" height="12" rx="6" fill="#BBCFEE" opacity="0.4"/>
  </g>

  <!-- Badge seta (canto inferior direito) -->
  <g transform="translate(680,700)" filter="url(#shadow-sm)">
    <circle r="80" fill="#2A5BD7"/>
    <circle r="80" fill="none" stroke="white" stroke-width="8"/>
    <!-- Seta → -->
    <path d="M -28,0 L 18,0 M 4,-18 L 28,0 L 4,18"
          stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>
  </g>
</svg>
