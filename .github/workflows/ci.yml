name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Tesseract (OCR) — .doc legado usa textutil nativo do macOS
        run: brew install tesseract tesseract-lang

      - name: Instalar dependências Python
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint (ruff)
        run: ruff check core/ tests/

      - name: Testes
        run: pytest tests/ -v --cov=core --cov-report=term-missing

      - name: Auditoria de dependências (pip-audit)
        run: pip-audit

      - name: Scan de segredos (detect-secrets)
        run: |
          detect-secrets scan --baseline .secrets.baseline
